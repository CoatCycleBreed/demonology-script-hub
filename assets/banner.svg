  <line x1="60" y1="60" x2="300" y2="60" stroke="url(#emberLine)" stroke-width="2"/>
  <line x1="900" y1="310" x2="1140" y2="310" stroke="url(#emberLine)" stroke-width="2"/>

  <circle cx="200" cy="200" r="3" fill="url(#dotGlow)"/>
